<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mobile Menu UI</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#101114;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.menu{width:min(92vw,390px);background:#191b20;border:1px solid #30333b;border-radius:18px;padding:18px;box-shadow:0 18px 50px #0008}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.title{font-size:22px;font-weight:800}
.status{font-size:12px;color:#75e69a}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;border:0;border-radius:10px;padding:11px;background:#252831;color:#aaa;font-weight:700}
.tab.active{background:#fff;color:#111}
.section{display:grid;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;background:#22252c;padding:14px;border-radius:12px}
.label{font-weight:700}
.desc{font-size:11px;color:#888;margin-top:3px}
.toggle{width:48px;height:28px;border:0;border-radius:20px;background:#454952;padding:3px}
.toggle i{display:block;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.toggle.on{background:#4ade80}.toggle.on i{transform:translateX(20px)}
.action{width:100%;border:0;border-radius:12px;padding:14px;background:#30343d;color:#fff;font-weight:800;font-size:15px}
.action:active,.tab:active{transform:scale(.98)}
input{width:100%;background:#22252c;border:1px solid #353943;color:#fff;border-radius:10px;padding:13px;font-size:15px}
.footer{text-align:center;color:#666;font-size:10px;margin-top:14px}
</style>
</head>
<body>
<div class="menu">
  <div class="header">
    <div class="title">Mobile Menu</div>
    <div class="status">ONLINE</div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('controls',this)">Controls</button>
    <button class="tab" onclick="showTab('players',this)">Players</button>
  </div>

  <div id="controls" class="section">
    <div class="row"><div><div class="label">Speed</div><div class="desc">UI demonstration toggle</div></div><button class="toggle" onclick="toggle(this)"><i></i></button></div>
    <div class="row"><div><div class="label">Fly</div><div class="desc">UI demonstration toggle</div></div><button class="toggle" onclick="toggle(this)"><i></i></button></div>
    <div class="row"><div><div class="label">Night Vision</div><div class="desc">UI demonstration toggle</div></div><button class="toggle" onclick="toggle(this)"><i></i></button></div>
    <button class="action" onclick="alert('Teleport button pressed')">Teleport</button>
    <button class="action" onclick="alert('Respawn button pressed')">Respawn</button>
  </div>

  <div id="players" class="section" style="display:none">
    <input placeholder="Player name">
    <button class="action" onclick="alert('Player selected')">Select Player</button>
    <button class="action" onclick="alert('Kick button pressed')">Kick</button>
    <button class="action" onclick="alert('Bring button pressed')">Bring</button>
  </div>

  <div class="footer">Standalone UI mockup — does not modify Roblox</div>
</div>

<script>
function toggle(el){el.classList.toggle('on')}
function showTab(id,button){
  document.getElementById('controls').style.display=id==='controls'?'grid':'none';
  document.getElementById('players').style.display=id==='players'?'grid':'none';
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  button.classList.add('active');
}
</script>
</body>
</html>
